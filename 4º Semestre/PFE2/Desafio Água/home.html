<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Água+ | Controle</title>

    <link rel="stylesheet" href="css/home.css">

</head>

<body>

    <header>

        <div class="logo">
            💧 Água+
        </div>


        <div class="tema">

            <span>Tema escuro</span>

            <label class="switch">

                <input type="checkbox" id="btnTema">

                <span class="slider"></span>

            </label>

        </div>

    </header>


    <main>

        <section class="topo">

            <div>

                <h1>
                    Controle de água
                </h1>

                <p>
                    Acompanhe seu consumo diário.
                </p>

            </div>

        </section>


        <section class="cards">

            <div class="card">

                <h3>
                    Meta diária
                </h3>

                <strong id="meta">
                    0 ml
                </strong>

                <p>
                    recomendação de 35 ml por kg
                </p>

            </div>


            <div class="card">

                <h3>
                    Consumido hoje
                </h3>

                <strong id="consumido">
                    0 ml
                </strong>

                <p>
                    total consumido
                </p>

            </div>


            <div class="card">

                <h3>
                    Meta atingida
                </h3>

                <strong id="porcentagem">
                    0%
                </strong>

                <p>
                    da meta diária
                </p>

            </div>

        </section>



        <section class="lista-container">

            <div class="titulo-lista">

                <h2>
                    Registros
                </h2>

                <button
                    id="btnAdicionar"
                    class="btn-adicionar"
                >
                    +
                </button>

            </div>


            <div id="listaAgua">

            </div>

        </section>



        <section class="grafico-container">

            <h2>
                Consumo de água
            </h2>

            <p>
                Histórico dos seus registros.
            </p>


            <div class="grafico">

                <canvas id="grafico"></canvas>

            </div>

        </section>

    </main>


    <div id="modal" class="modal">

        <div class="modal-conteudo">

            <button
                id="fecharModal"
                class="fechar"
            >
                ×
            </button>


            <h2>
                Adicionar consumo
            </h2>


            <form id="formAgua">

                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <label for="quantidade">
                    Quantidade de água (ml)
                </label>

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Ex: 500"
                    min="1"
                    required
                >


                <label for="peso">
                    Peso atual (kg)
                </label>

                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 60"
                    min="1"
                    step="0.1"
                    required
                >


                <button
                    type="submit"
                    class="btn-salvar"
                >
                    Salvar registro
                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script src="js/home.js"></script>

</body>

</html>
